federation:
  evidence_envelope:
    invariants:
      - signal_id never null
      - checksum computed before routing
      - intent set from intent_canon, not from LLM
      - epistemic_label defaults to OBS for raw signal, DER for classification
    schema:
      checksum:
        description: Content integrity hash for audit trail
        required: true
        type: sha256
      epistemic_label:
        description: Epistemic tag on classification confidence
        required: true
        type: enum
        values:
          - OBS
          - DER
          - INT
          - SPEC
          - UNKNOWN
      intent:
        description: Classified intent from intent_canon — set BEFORE routing
        required: true
        type: enum
        values:
          - governance
          - execution
          - geology
          - finance
          - health
          - federation
          - bridge
          - unknown
      metadata:
        properties:
          duration_ms: integer
          language: string
          mime_type: string
          reply_to: string
          size_bytes: integer
        required: false
        type: object
      payload:
        description: Raw signal content, modality-dependent
        required: true
        type: any
      signal_id:
        description: Unique signal identifier, generated at ingress
        required: true
        type: uuid
      source:
        description: Transport surface that received the signal
        required: true
        type: enum
        values:
          - telegram
          - api
          - mcp
          - cron
          - a2a
          - websocket
      source_id:
        description: Platform-specific identifier (chat_id, user_id, request_id)
        required: false
        type: string
      timestamp:
        description: Ingress timestamp (T₀), set at signal arrival
        required: true
        type: iso8601
      type:
        description: Modality of the incoming signal
        required: true
        type: enum
        values:
          - text
          - image
          - audio
          - video
          - document
          - command
          - event
    sealed: '2026-07-26'
    version: 1
  intent_canon:
    authority: F13_SOVEREIGN
    catch_all:
      organ: arifOS
      reason: Unclassified signals escalate to kernel for judgment
    mapping:
      bridge:
        description: Signal relay, multimodal intake, skill catalog, FLAME mesh
        organ: HERMES
        port: 18086
      execution:
        description: Build, deploy, mutate, shell commands, forge operations
        organ: A-FORGE
        port: 7071
      federation:
        description: Cockpit, A2A routing, agent registry, state visibility
        organ: AAA
        port: 3001
      finance:
        description: NPV, IRR, EMV, market data, conservation, capital wisdom
        organ: WEALTH
        port: 18082
      geology:
        description: Seismic, petrophysics, basin, prospect, well logs, earth evidence
        organ: GEOX
        port: 8081
      governance:
        description: Constitutional verdicts, F1-F13, session binding, seal, hold
        organ: arifOS
        port: 8088
      health:
        description: Vitality, fatigue, dignity, homeostasis, readiness (REFLECT_ONLY)
        organ: WELL
        port: 18083
    rule: one_signal_one_destination
    sealed: '2026-07-26'
    version: 1
  router:
    default: arif_route
    enabled: true
    organs:
      A-FORGE:
        host: 127.0.0.1
        port: 7072
        prefix: forge_
      GEOX:
        host: 127.0.0.1
        port: 8081
        prefix: geox_
      HERMES:
        host: 127.0.0.1
        port: 18086
        prefix: hermes_
      WEALTH:
        host: 127.0.0.1
        port: 18082
        prefix: wealth_
      WELL:
        host: 127.0.0.1
        port: 18083
        prefix: well_
      arifOS:
        host: 127.0.0.1
        port: 8088
        prefix: arif_
  routing_receipt:
    backend: kabarkan
    enabled: true
    invariants:
      - every_signal_produces_exactly_one_receipt
      - receipt_id links to signal_id from evidence_envelope
      - status=ROUTED requires target organ /health 200
      - status=FAILED triggers retry or escalation
      - receipt stored in kabarkan-ingest JetStream stream
      - receipt hash anchored in VAULT999 cooling-ledger.jsonl
    pipeline:
      classify: intent assigned from intent_canon (deterministic, not LLM)
      ingress: signal_id generated, checksum computed, envelope sealed
      receipt: receipt emitted to kabarkan-ingest JetStream
      route: signal dispatched to target organ
      verify: receipt hash linked to VAULT999 seal chain
    schema:
      checksum:
        ref: evidence_envelope.checksum
        required: true
        type: sha256
      from:
        required: true
        type: enum
        values:
          - telegram
          - api
          - mcp
          - cron
          - a2a
          - websocket
      intent:
        ref: intent_canon.mapping keys
        required: true
        type: string
      latency_ms:
        required: true
        type: integer
      receipt_id:
        required: true
        type: uuid
      signal_id:
        ref: evidence_envelope.signal_id
        required: true
        type: uuid
      status:
        required: true
        type: enum
        values:
          - ROUTED
          - FAILED
          - REJECTED
          - HOLD
          - REDIRECTED
      timestamp_routed:
        required: true
        type: iso8601
      to:
        required: true
        type: enum
        values:
          - arifOS
          - A-FORGE
          - GEOX
          - WEALTH
          - WELL
          - AAA
          - HERMES
    sealed: '2026-07-26'
    version: 1
  skill_governor:
    canonical_registry: /root/AAA/skills/FEDERATED_SKILLS_REGISTRY_V3.yaml
    invariants:
      - every_skill_has_owner
      - no_skill_owned_by_two_organs
      - canonical_registry_is_source_of_truth
      - hermes_catalogs_never_owns_domain_skills
    ownership:
      A-FORGE:
        description: Execution, build, deploy, git, docker, shell
        domains:
          - forge
          - dev
          - ops
        skills:
          - forge-exec
          - forge-verbs
          - dev-github
          - ops-docker
          - ops-vps
      GEOX:
        description: Earth intelligence — seismic, basin, petrophysics, prospect
        domains:
          - geo
        skills:
          - geo-basin
          - geo-constitution
          - geo-petrophysics
          - geo-writing
          - geo-well-tie
          - geo-artifact-rigor
          - geo-prospect
      HERMES:
        description: Bridge — skill catalog, multimodal, signal relay, FLAME, Telegram
        domains:
          - meta
          - research
          - a2a
          - sec
        skills:
          - meta-skill-create
          - meta-skill-lint
          - meta-rsi
          - meta-atlas
          - meta-plan
          - research-summarize
          - research-search
          - research-deep
          - a2a-onboard
          - a2a-sovereign
          - sec-secrets
          - sec-telegram
      WEALTH:
        description: Capital intelligence — NPV, market, conservation, wisdom
        domains:
          - wealth
        skills:
          - wealth-reason
          - wealth-thermo
          - wealth-collapse
      WELL:
        description: Human readiness — vitality, fatigue, dignity (REFLECT_ONLY)
        domains:
          - well
        skills:
          - well-boundary
          - well-readiness
      arifOS:
        description: Constitutional, judgment, seal, session, F1-F13
        domains:
          - kernel
        skills:
          - kernel-eureka
          - kernel-superposition
    rule: skill_owner_is_organ
    sealed: '2026-07-26'
    version: 1
