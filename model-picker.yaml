# model-picker.yaml — canonical model routing for Hermes Agent
# PROBED: 2026-07-31 ~06:30 UTC | Qwen Token Plan Pro activated (9 models, flat monthly)
# RULE: no model string hardcoded anywhere else. This file is the picker.
# STRATEGY: Qwen Token Plan Pro = flat monthly = ZERO marginal cost. Route everything through it.
# FALLBACK: Direct DeepSeek ($12.63 prepaid) → Bailian (20 models) → MiMo → Kimi → Groq → Gemini
# THROTTLE: When qwen_throttle exists (>80% credit window), route to qwen3.6-flash or fallback.
#   Check: python3 /root/AAA/scripts/qwen_throttle_check.py (exit 1 = throttle)
#
# ── ROUTING CONSTRAINT (Zen 1 — forged 2026-07-31) ──
# Every model carries `requires:` — what runtime it NEEDS.
#   api    = cloud API only (DeepSeek, Qwen, Groq, etc.)
#   local  = local inference only (Ollama, llama.cpp)
#   any    = both cloud and local work
# Router rule: if requires=local and local backend is DOWN → FAIL FAST (503).
#   Do NOT silently fallback to cloud — this is a privacy/determinism boundary.
#   Docker Model Runner (Jul 2026) validated the model-as-artifact pattern.
#   We already built FLAME/FED. This field closes the negative-knowledge gap.

