name: Repo Routing Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches-ignore: []

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate REPO trailer
        run: |
          set -euo pipefail
          echo "HERMES — bridge organ. REPO= trailer advisory only."
          # Only check the latest commit for REPO= trailer
          LATEST=$(git log -1 --format='%H %B')
          if echo "$LATEST" | grep -qi "^REPO="; then
            echo "✅ Latest commit has REPO= trailer"
          else
            echo "⚠️ Latest commit missing REPO= trailer (advisory)"
          fi
